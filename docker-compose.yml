# Bookshelf — pile de production : PostgreSQL + API + front (Nginx).
#
#   cp .env.example .env      # puis renseigner JWT_SECRET, POSTGRES_PASSWORD, APP_URL
#   docker compose up -d --build
#   → http://127.0.0.1:8082   (PORT), sur la machine elle-même seulement
#
# Seul le front est publié, et UNIQUEMENT sur 127.0.0.1 : on y accède par le
# reverse proxy de l'hôte (Caddy, cf. deploy/Caddyfile et docs/DEPLOY-VPS.md),
# jamais directement depuis Internet. Il sert la PWA et relaie /api vers l'API.
# PostgreSQL et l'API restent sur le réseau interne de la pile.

name: bookshelf

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookshelf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Renseigner POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-bookshelf}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: bookshelf-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-bookshelf}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bookshelf}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Renseigner JWT_SECRET dans .env (32 caractères minimum)}
      # Proxys devant l'API : Caddy (hôte) puis Nginx (conteneur front) = 2 sauts.
      # Sans ça, tous les visiteurs auraient l'IP du proxy : le limiteur de
      # connexion (par IP) les bloquerait tous ensemble.
      TRUST_PROXY: ${TRUST_PROXY:-2}
      # `false` tant que le site est servi en HTTP (IP sans certificat) :
      # un cookie `Secure` n'y serait jamais renvoyé, la connexion échouerait.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-${APP_URL:-http://localhost:8082}}
      PUBLIC_API_BASE: ${PUBLIC_API_BASE:-/api}
      CATALOG_SYNC: ${CATALOG_SYNC:-on}
      MANGADEX_USER_AGENT: ${MANGADEX_USER_AGENT:-Bookshelf/0.1 (projet perso)}
      # E-mails (code de vérification à l'inscription). Sans SMTP_HOST, les
      # inscriptions sont refusées : aucun compte sans adresse vérifiée.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Bookshelf <no-reply@bookshelf.local>}
      # Extensions Tachiyomi / Mihon via le pont `suwayomi` (profil `tachiyomi`,
      # cf. plus bas et .env.example). Désactivées par défaut.
      TACHIYOMI_BRIDGE_ENABLED: ${TACHIYOMI_BRIDGE_ENABLED:-false}
      TACHIYOMI_BRIDGE_URL: ${TACHIYOMI_BRIDGE_URL:-http://suwayomi:4567}
      TACHIYOMI_BRIDGE_TIMEOUT_MS: ${TACHIYOMI_BRIDGE_TIMEOUT_MS:-3000}
      TACHIYOMI_BRIDGE_LANGUAGES: ${TACHIYOMI_BRIDGE_LANGUAGES:-fr,en}
      TACHIYOMI_BRIDGE_MAX_SOURCES: ${TACHIYOMI_BRIDGE_MAX_SOURCES:-10}
      TACHIYOMI_BRIDGE_NSFW: ${TACHIYOMI_BRIDGE_NSFW:-false}
      TACHIYOMI_BRIDGE_USER: ${TACHIYOMI_BRIDGE_USER:-}
      TACHIYOMI_BRIDGE_PASSWORD: ${TACHIYOMI_BRIDGE_PASSWORD:-}
      TACHIYOMI_EXTENSIONS: ${TACHIYOMI_EXTENSIONS:-}
      TACHIYOMI_SOURCES: ${TACHIYOMI_SOURCES:-}
      # Recette : boosters illimités. Jamais en production.
      BOOSTER_UNLIMITED_MODE: ${BOOSTER_UNLIMITED_MODE:-false}
      # Romans EPUB des comptes : fichiers dans le volume `books_data` (cf. plus bas).
      BOOKS_MAX_UPLOAD_MB: ${BOOKS_MAX_UPLOAD_MB:-50}
      BOOKS_QUOTA_MB: ${BOOKS_QUOTA_MB:-2048}
      BOOKS_METADATA_LOOKUP: ${BOOKS_METADATA_LOOKUP:-on}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
    volumes:
      # EPUB importés et couvertures extraites : survivent aux reconstructions de l'image.
      # À sauvegarder avec la base (les fiches `UserBook` y renvoient).
      - books_data:/app/backend/uploads
    networks:
      default:
        # Nom visé par le Nginx du front : unique, même si le front rejoint le
        # réseau d'un Caddy partagé (docker-compose.caddy.yml).
        aliases: [bookshelf-api]
    # Pas de `ports` : l'API n'est joignable que par le front (réseau interne).
    # Pour la déboguer depuis l'hôte : `docker compose exec backend wget -qO- 127.0.0.1:5000/api/health`.

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: bookshelf-web:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Lié à 127.0.0.1 : injoignable depuis l'extérieur, seul Caddy (sur l'hôte) y
    # accède. (Docker publie ses ports AVANT le pare-feu de l'hôte, ufw compris :
    # une liaison sur 0.0.0.0 contournerait Caddy et exposerait le HTTP brut.)
    ports:
      - "127.0.0.1:${PORT:-8082}:80"

  # Pont des extensions Tachiyomi / Mihon : Suwayomi-Server exécute les APK
  # (Kotlin, dans une JVM) et expose une API GraphQL que seule l'API interroge.
  # FACULTATIF : ne démarre qu'avec le profil `tachiyomi`
  # (`COMPOSE_PROFILES=tachiyomi` dans .env). Compter ~400-700 Mo de RAM.
  suwayomi:
    # v2.3.2243 = `stable` : première version qui suit le passage des dépôts
    # (Keiyoushi…) au format « Extension Store » de Mihon.
    image: ${SUWAYOMI_IMAGE:-ghcr.io/suwayomi/suwayomi-server:v2.3.2243}
    profiles: [tachiyomi]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
      # Personne ne l'ouvre dans un navigateur : pas d'interface web.
      WEB_UI_ENABLED: "false"
      # Dépôt d'extensions, au format JSON (liste). Keiyoushi par défaut ; les
      # miroirs (everfio/tachiyomi-extensions…) pointent vers le même catalogue.
      EXTENSION_STORES: '${TACHIYOMI_EXTENSION_STORES:-["https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.min.json"]}'
      # `basic_auth` + TACHIYOMI_BRIDGE_USER / _PASSWORD pour exiger un compte.
      AUTH_MODE: ${TACHIYOMI_BRIDGE_AUTH_MODE:-none}
      AUTH_USERNAME: ${TACHIYOMI_BRIDGE_USER:-}
      AUTH_PASSWORD: ${TACHIYOMI_BRIDGE_PASSWORD:-}
      # Sites derrière Cloudflare : passés par FlareSolverr (profil `flaresolverr`, plus bas).
      FLARESOLVERR_ENABLED: ${TACHIYOMI_FLARESOLVERR_ENABLED:-false}
      FLARESOLVERR_URL: http://flaresolverr:8191
      # Tas Java borné : la RAM du VPS est partagée avec d'autres projets.
      JAVA_TOOL_OPTIONS: -Xmx${SUWAYOMI_MAX_HEAP:-512m}
    volumes:
      # Extensions installées, base H2, cookies des sites (Cloudflare).
      - suwayomi_data:/home/suwayomi/.local/share/Tachidesk
    mem_limit: ${SUWAYOMI_MEM_LIMIT:-1g}
    # Pas de `ports` : joignable par l'API seule, sur le réseau interne
    # (`http://suwayomi:4567`). Rien n'est publié, pas même sur 127.0.0.1.
    # Extensions (catalogue, installation) : `docker compose exec backend node dist/extensions/tachiyomi.cli.js`.

  # Résout les défis Cloudflare pour le pont (Chromium sans écran), qui garde
  # ensuite le cookie `cf_clearance`. FACULTATIF : profil `flaresolverr`
  # (`COMPOSE_PROFILES=tachiyomi,flaresolverr`) + TACHIYOMI_FLARESOLVERR_ENABLED=true.
  # Compter ~300-600 Mo de RAM. Réseau interne seulement, aucun port publié.
  flaresolverr:
    image: ${FLARESOLVERR_IMAGE:-ghcr.io/flaresolverr/flaresolverr:v3.5.2}
    profiles: [flaresolverr]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
      LOG_LEVEL: info
    mem_limit: ${FLARESOLVERR_MEM_LIMIT:-1g}

volumes:
  postgres_data:
  suwayomi_data:
  books_data:
