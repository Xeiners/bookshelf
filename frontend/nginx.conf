# Bookshelf — front statique (SPA + PWA) et relais de l'API.

# Protocole d'origine : celui qu'annonce le proxy de l'hôte (Caddy) s'il y en a un,
# sinon le nôtre. L'API sait ainsi si le navigateur est en HTTP ou en HTTPS.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;

  # ---- Compression ------------------------------------------------------------
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

  # ---- En-têtes de sécurité (repris dans chaque `location` qui en ajoute) ------
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Sonde de santé du conteneur.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # ---- API : relais vers le conteneur backend ------------------------------------
  # Même origine pour le navigateur : ni CORS, ni cookie tiers. La résolution DNS
  # via une variable (résolveur Docker) laisse Nginx démarrer même si l'API redémarre.
  # Nom UNIQUE (`bookshelf-api`, alias défini dans docker-compose.yml) : relié au
  # réseau d'un Caddy partagé, ce conteneur voit les autres piles ; un nom
  # courant comme `backend` pourrait y désigner le conteneur d'un autre projet.
  # `^~` : ce préfixe l'emporte sur les `location ~` plus bas. Sans lui, la règle
  # des images (`\.jpg$`) captait `/api/covers/….jpg` et répondait 404 elle-même.
  location ^~ /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://bookshelf-api:5000;
    proxy_pass $api_upstream;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";

    # Fusion d'une bibliothèque invitée : jusqu'à 2 Mo (limite d'Express).
    client_max_body_size 2m;
    proxy_read_timeout 60s;
  }

  # ---- PWA : ces fichiers ne doivent jamais rester en cache ----------------------
  # Sinon une nouvelle version ne serait jamais détectée.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    # Type absent de certaines versions de mime.types (bloc limité à ce fichier).
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
  }

  # ---- Assets Vite : noms hachés, donc immuables ---------------------------------
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Icônes et fichiers publics : un jour.
  location ~* \.(?:png|svg|ico|webp|jpg|jpeg)$ {
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # ---- Routage SPA -----------------------------------------------------------------
  location / {
    try_files $uri $uri/ /index.html;
  }
}
